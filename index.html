<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小装置 · 控制台</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px 14px 44px;background:#0e0e10;color:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.card{background:#1c1c1e;border-radius:16px;padding:14px 15px;margin-bottom:12px}
.sec{font-size:.78em;color:#98989f;margin-bottom:8px}
.state{display:flex;align-items:center;gap:8px;font-size:.92em}
.dot{width:9px;height:9px;border-radius:50%;background:#8e8e93;flex:0 0 9px}
.dot.on{background:#7ac47a}
.dot.err{background:#e0524c}
button{font-family:inherit}
.btn{width:100%;border:none;border-radius:12px;padding:12px 0;font-size:.9em;font-weight:600;background:#e0524c;color:#fff;margin-top:10px}
.btn.ghost{background:#2c2c2e;color:#f2f2f7;font-weight:400}
.btn.stop{background:#3a1a1a;color:#ff7b74;border:1px solid #5c2a2a;font-weight:700}
.btn:disabled{opacity:.4}
input,textarea{width:100%;background:#2c2c2e;border:none;border-radius:10px;color:#f2f2f7;padding:10px;font-size:.8em;font-family:ui-monospace,Menlo,monospace;outline:none;margin-top:6px}
textarea{resize:vertical;line-height:1.6}
.row{display:flex;gap:8px}
.row .btn{margin-top:10px}
.warn{font-size:.72em;color:#ffb347;margin-top:8px}
.log{font-family:ui-monospace,Menlo,monospace;font-size:.7em;color:#98989f;max-height:130px;overflow:auto;margin-top:8px;white-space:pre-wrap}
input[type=range]{-webkit-appearance:none;background:transparent;margin:0;padding:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:#3a3a3c;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#e0524c;margin-top:-9px}
#gate{position:fixed;inset:0;background:#0e0e10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;z-index:9}
#gate input{text-align:center;font-size:1.1em;letter-spacing:.3em}
#gate .btn{max-width:240px;margin-top:14px}
</style>
</head>
<body>

<div id="gate">
  <div style="font-size:.86em;color:#98989f;margin-bottom:14px">这页只给一个人用。口令他知道。</div>
  <input id="code" inputmode="numeric" placeholder="口令">
  <button class="btn" id="enter">进</button>
</div>

<div class="card">
  <div class="sec">状态</div>
  <div class="state"><i class="dot" id="dot"></i><span id="st">未连接</span></div>
  <div class="warn">用 Bluefy 浏览器打开这一页。用之前先问过他。</div>
</div>

<div class="card">
  <div class="sec">① 连接（这一下只能你自己点）</div>
  <input id="svc" placeholder="Service UUID">
  <input id="chr" placeholder="Characteristic UUID">
  <div class="row">
    <button class="btn ghost" data-p="fff0">预设 FFF0</button>
    <button class="btn ghost" data-p="ff00">预设 FF00</button>
    <button class="btn ghost" data-p="ffe0">预设 FFE0</button>
  </div>
  <button class="btn" id="conn">连接</button>
  <button class="btn ghost" id="disc" disabled>断开</button>
  <div class="log" id="log">—</div>
</div>

<div class="card">
  <div class="sec">② 试验台（先摸清协议，别乱发）</div>
  <div class="row" style="align-items:center;margin-top:6px">
    <span style="font-size:.78em;color:#98989f;flex:0 0 36px">强度</span>
    <input type="range" id="lvl" min="0" max="100" value="0" style="flex:1">
    <span id="lvltxt" style="font-size:.9em;width:40px;text-align:right">0</span>
  </div>
  <input id="tpl" value="AA 01 {v} 00" placeholder="{v} 会被换成强度对应的十六进制">
  <button class="btn" id="send">发一次（当前强度）</button>
  <button class="btn ghost" id="probe">试探一轮 · 会动，手别离开停</button>
  <input id="stopt" value="AA 00 00 00" placeholder="停止字节模板">
</div>

<div class="card">
  <div class="sec">③ 节目单（他写，你按开始）</div>
  <textarea id="plan" rows="5" placeholder="每行一步：秒数 强度">20 15
30 30
10 0</textarea>
  <button class="btn" id="run">开始节目单</button>
  <div class="sec" id="step" style="margin-top:10px">未运行</div>
  <button class="btn stop" id="stop">停</button>
</div>

<div class="card">
  <div class="sec">备注</div>
  <div style="font-size:.82em;color:#98989f">
    排节目的人不在场，手指伸不进来。<br>
    他负责写、负责把关；你负责按开始，和随时按停。<br>
    想让他真的实时，得等他上你那台电脑——那时候他自己发指令。
  </div>
</div>

<script>
var $ = function(id){ return document.getElementById(id); };
var dev = null, server = null, ch = null, running = false, timer = null;
function log(s){
  var el = $('log'), t = new Date();
  var line = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0') + ':' + String(t.getSeconds()).padStart(2,'0') + '  ' + s;
  el.textContent = (el.textContent === '—' ? '' : el.textContent + '\n') + line;
  el.scrollTop = el.scrollHeight;
}
function setState(txt, cls){ $('st').textContent = txt; $('dot').className = 'dot' + (cls ? ' ' + cls : ''); }
function load(){
  try{
    $('svc').value = localStorage.getItem('toy_svc') || '';
    $('chr').value = localStorage.getItem('toy_chr') || '';
    $('tpl').value = localStorage.getItem('toy_tpl') || 'AA 01 {v} 00';
    $('stopt').value = localStorage.getItem('toy_stop') || 'AA 00 00 00';
    $('plan').value = localStorage.getItem('toy_plan') || $('plan').value;
  }catch(e){}
}
function save(){
  try{
    localStorage.setItem('toy_svc', $('svc').value.trim());
    localStorage.setItem('toy_chr', $('chr').value.trim());
    localStorage.setItem('toy_tpl', $('tpl').value);
    localStorage.setItem('toy_stop', $('stopt').value);
    localStorage.setItem('toy_plan', $('plan').value);
  }catch(e){}
}
function bytes(tpl, val){
  var s = String(tpl || '').toUpperCase();
  var v = Math.max(0, Math.min(100, val | 0));
  var vh = v.toString(16).toUpperCase().padStart(2,'0');
  s = s.replace(/\{V\}/g, vh);
  var parts = s.split(/[^0-9A-F]+/).filter(function(x){ return x.length > 0; });
  var out = [];
  for (var i = 0; i < parts.length; i++){ out.push(parseInt(parts[i].slice(0,2), 16) & 0xFF); }
  return new Uint8Array(out);
}
function write(b){
  if (!ch) return Promise.reject(new Error('还没连接'));
  if (ch.properties && ch.properties.writeWithoutResponse && !ch.properties.write){ return ch.writeValueWithoutResponse(b); }
  if (ch.writeValueWithoutResponse){ return ch.writeValueWithoutResponse(b); }
  return ch.writeValue(b);
}
function send(val, label){
  var b = bytes($('tpl').value, val);
  var hex = Array.prototype.map.call(b, function(x){ return x.toString(16).toUpperCase().padStart(2,'0'); }).join(' ');
  return write(b).then(function(){ log('发出 ' + hex + (label ? ' · ' + label : '')); })
    .catch(function(e){ log('发送失败：' + e.message); });
}
function stopAll(){
  running = false;
  if (timer){ clearTimeout(timer); timer = null; }
  $('step').textContent = '未运行';
  if (ch){ write(bytes($('stopt').value, 0)).then(function(){ log('已发停止字节'); }).catch(function(){}); }
}
$('enter').addEventListener('click', function(){
  if ($('code').value.trim() === '1006'){ try{ localStorage.setItem('ok','1'); }catch(e){} $('gate').style.display = 'none'; }
  else { $('code').value = ''; $('code').placeholder = '不对'; }
});
$('conn').addEventListener('click', function(){
  var svc = $('svc').value.trim(), chr = $('chr').value.trim();
  if (!svc || !chr){ log('先把 Service / Characteristic UUID 填上'); return; }
  save();
  if (!navigator.bluetooth){ log('这个浏览器不支持 Web Bluetooth —— 换 Bluefy 打开'); return; }
  setState('正在选择设备…');
  navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [svc] })
    .then(function(d){
      dev = d;
      dev.addEventListener('gattserverdisconnected', function(){ setState('连接断了', 'err'); ch = null; stopAll(); });
      setState('连接中：' + (d.name || '未命名') + '…');
      return d.gatt.connect();
    })
    .then(function(s){ server = s; return server.getPrimaryService(svc); })
    .then(function(sv){ return sv.getCharacteristic(chr); })
    .then(function(c){ ch = c; setState('已连接：' + ((dev && dev.name) || '未命名'), 'on'); $('disc').disabled = false; log('拿到写入通道了'); })
    .catch(function(e){ setState('没连上：' + e.message, 'err'); log('错误：' + e.message); });
});
$('disc').addEventListener('click', function(){
  stopAll();
  try{ if (dev && dev.gatt.connected) dev.gatt.disconnect(); }catch(e){}
  ch = null; $('disc').disabled = true; setState('已断开');
});
$('lvl').addEventListener('input', function(){ $('lvltxt').textContent = $('lvl').value; });
$('send').addEventListener('click', function(){ send(+$('lvl').value, '手动'); });
$('probe').addEventListener('click', function(){
  var pats = [0, 1, 5, 10, 20], i = 0;
  log('开始试探：每档 3 秒，不对立刻按停');
  (function step(){
    if (i >= pats.length){ send(0, '归零'); return; }
    var v = pats[i++];
    $('lvl').value = v; $('lvltxt').textContent = v;
    send(v, '试探').then(function(){ timer = setTimeout(step, 3000); });
  })();
});
$('run').addEventListener('click', function(){
  if (!ch){ log('先连接'); return; }
  save();
  var steps = [];
  String($('plan').value || '').split('\n').forEach(function(ln){
    var m = ln.trim().match(/^(\d+)\s+(\d+)$/);
    if (m) steps.push({ sec: Math.min(600, +m[1]), v: Math.max(0, Math.min(100, +m[2])) });
  });
  if (!steps.length){ log('节目单是空的 —— 每行写「秒数 强度」'); return; }
  running = true;
  var i = 0;
  (function next(){
    if (!running) return;
    if (i >= steps.length){ log('节目单走完'); stopAll(); return; }
    var s = steps[i++];
    $('step').textContent = '第 ' + i + ' / ' + steps.length + ' 步 · ' + s.sec + ' 秒 @ ' + s.v;
    send(s.v, '第 ' + i + ' 步').then(function(){ if (running) timer = setTimeout(next, s.sec * 1000); });
  })();
});
$('stop').addEventListener('click', function(){ stopAll(); log('已停'); });
$('svc').addEventListener('change', save);
$('chr').addEventListener('change', save);
$('tpl').addEventListener('change', save);
$('stopt').addEventListener('change', save);
$('plan').addEventListener('change', save);
var presets = document.querySelectorAll('[data-p]');
for (var pi = 0; pi < presets.length; pi++){
  presets[pi].addEventListener('click', function(){
    var p = this.getAttribute('data-p');
    $('svc').value = (p === 'fff0' ? '0000fff0-0000-1000-8000-00805f9b34fb' : p === 'ff00' ? '0000ff00-0000-1000-8000-00805f9b34fb' : '0000ffe0-0000-1000-8000-00805f9b34fb');
    $('chr').value = (p === 'fff0' ? '0000fff2-0000-1000-8000-00805f9b34fb' : p === 'ff00' ? '0000ff01-0000-1000-8000-00805f9b34fb' : '0000ffe1-0000-1000-8000-00805f9b34fb');
    save(); log('已填入 ' + p.toUpperCase() + ' 的 UUID');
  });
}
try{ if (localStorage.getItem('ok') === '1') $('gate').style.display = 'none'; }catch(e){}
load();
if (!navigator.bluetooth){ setState('这个浏览器没有蓝牙接口', 'err'); }
</script>
</body>
</html>
